# A green run here means the same as a green local run of the gates not marked local.
# This workflow publishes nothing; release.yml releases after a green run of it on main.
# Pull requests skip only documentation paths; pushes to main are never filtered.
name: Gates

on:
  pull_request:
    paths-ignore:
      - docs/**/*.md
      - CONTRIBUTING.md
      - .github/ISSUE_TEMPLATE/*.md
      - .github/PULL_REQUEST_TEMPLATE.md
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.15"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install
        run: python -m pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -q -p no:cacheprovider
      - name: ruff
        run: python -m ruff check .
