# Releases the package after a green run of the Gates workflow on main.
# It runs no gate itself. After the GitHub release it publishes the same
# built files to TestPyPI, then to PyPI, by trusted publishing (no token).
name: Release

on:
  workflow_run:
    workflows: [Gates]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      released: ${{ steps.decide.outputs.release }}
    env:
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: decide
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          tag="v$version"
          status=0
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" ls-remote --exit-code --tags origin "refs/tags/$tag" || status=$?
          case "$status" in
            0) echo "release=no" >> "$GITHUB_OUTPUT" ;;
            2) echo "release=yes" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag lookup failed with status $status" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: build
        if: steps.decide.outputs.release == 'yes'
        run: |
          python -m pip install build==1.6.0
          python -m build
      - name: release
        if: steps.decide.outputs.release == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: gh release create "$TAG" dist/* --target "$TESTED_SHA" --title "$TAG" --generate-notes
      - name: upload files
        if: steps.decide.outputs.release == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  testpypi:
    name: testpypi
    needs: release
    if: needs.release.outputs.released == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: pypi
    needs: [release, testpypi]
    if: needs.release.outputs.released == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
