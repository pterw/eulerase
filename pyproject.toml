[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eulerase"
version = "0.1.0"
description = "Learn and explore de Bruijn graphs: Eulerian trails and contigs from sequences"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["de Bruijn graph", "Eulerian trail", "k-mer", "genome assembly", "bioinformatics", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.13"
dependencies = [
    "networkx==3.6.1",
    "biopython==1.88",
    "matplotlib==3.11.2",
]

[project.urls]
Repository = "https://github.com/pterw/eulerase"
Issues = "https://github.com/pterw/eulerase/issues"
Changelog = "https://github.com/pterw/eulerase/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "ruff==0.16.10",
]

[project.scripts]
eulerase = "eulerase.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pandas".msg = "not a dependency"
"sklearn".msg = "not a dependency"
"scipy".msg = "not a dependency"
